<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Purdue automatic sign-in</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="masthead"><span class="brand-mark" aria-hidden="true">P</span><strong>Purdue automatic sign-in</strong></header>
  <main class="popup-main">
    <section id="setup-intro"><h1>A shorter sign-in.</h1><p class="lede">Connect your Purdue account and authenticator to get started.</p></section>
    <p id="account-label" class="popup-account" hidden></p>
    <p class="state-line"><span id="state-dot" class="state-dot off" aria-hidden="true"></span><span id="pause-state" role="status" aria-live="polite"></span></p>
    <div id="controls" hidden>
      <div id="pause-controls"><label for="pause-length">Pause automatic sign-in for</label><select id="pause-length"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="until-resumed">Until I resume</option></select><div class="actions"><button id="pause" class="secondary">Pause automatic sign-in</button></div></div>
      <button id="resume" class="primary" hidden>Resume automatic sign-in</button>
      <p class="small">To use another account, pause first, then choose it on the website.</p>
    </div>
    <div class="popup-bottom"><button id="settings" class="primary">Start setup</button><button id="retry" class="text-button" hidden>Retry sign-in</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="setup-core.js"></script><script src="popup.js"></script>
</body>
</html>
